name: Deploy Functions

# Deploys on every push to main. Uses OIDC (azure/login) instead of a
# publish profile, so it works even when SCM basic-auth publishing is
# disabled on the Function App.
#
# One-time setup (run locally with Azure CLI, replacing <sub>, <owner>/<repo>):
#   az ad app create --display-name "gh-mnpsalumni-deploy"
#   APP_ID=$(az ad app list --display-name "gh-mnpsalumni-deploy" --query "[0].appId" -o tsv)
#   az ad sp create --id $APP_ID
#   az role assignment create --assignee $APP_ID --role Contributor \
#     --scope /subscriptions/<sub>/resourceGroups/rg-mnpsalumni-01
#   az ad app federated-credential create --id $APP_ID --parameters '{
#     "name":"github-main",
#     "issuer":"https://token.actions.githubusercontent.com",
#     "subject":"repo:<owner>/<repo>:ref:refs/heads/main",
#     "audiences":["api://AzureADTokenExchange"] }'
# Then add three GitHub repo secrets:
#   AZURE_CLIENT_ID       = $APP_ID
#   AZURE_TENANT_ID       = (az account show --query tenantId -o tsv)
#   AZURE_SUBSCRIPTION_ID = (az account show --query id -o tsv)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_FUNCTIONAPP_NAME: func-mnpsalumni-01
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build & publish
        run: dotnet publish -c Release -o ./output

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ./output
